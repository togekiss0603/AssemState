name: Offline reproduction
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python scripts/verify_release.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/reproduce_tables.py
      - run: python scripts/audit_paper_alignment.py
